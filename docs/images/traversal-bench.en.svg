<rect x='262' y='79' width='12' height='10' rx='2' fill='#9aa1aa'/><text x='280' y='88' font-size='11.5' fill='#59636e'>dark = gcc 13.3</text>
<rect x='406' y='79' width='12' height='10' rx='2' fill='#9aa1aa' fill-opacity='0.45'/><text x='424' y='88' font-size='11.5' fill='#59636e'>light = clang 18.1</text>
<text x='24' y='118' font-weight='600' fill='#1f2328'>Linked in creation order</text>
<text x='36' y='142' fill='#1f2328'>C, raw pointers (packed malloc)</text>

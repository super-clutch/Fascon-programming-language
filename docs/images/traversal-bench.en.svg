<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 470' width='780' height='470' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12'>
<rect width='780' height='470' fill='#ffffff'/>
<text x='24' y='28' font-size='15' font-weight='600' fill='#1f2328'>On a scattered list, the Fascon Id chain beats raw pointers</text>
<text x='24' y='50' font-size='11.5' fill='#59636e'>Time per task (ns, shorter is faster) - summing vruntime over 60,000 tasks - Fascon 1.0.0</text>
<text x='24' y='68' font-size='11.5' fill='#1f2328'>Scattered: Fascon 1.2-2.8x faster.   Creation order: raw pointers 1.3-1.9x faster.   Table scan: under 1 ns.</text>

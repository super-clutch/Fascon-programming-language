<text x='694.6' y='322' font-size='11' fill='#59636e'>76.22 ns</text>
<text x='36' y='354' fill='#1f2328'>Fascon・get での Id の連鎖（分岐）</text>
<rect x='320' y='338' width='140.0' height='10' rx='2' fill='#2f6fdb' fill-opacity='1'/>
<text x='466.0' y='347' font-size='11' fill='#59636e'>28.95 ns</text>

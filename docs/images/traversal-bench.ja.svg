<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 470' width='780' height='470' font-family='Noto Sans CJK JP, Noto Sans JP, sans-serif' font-size='12'>
<rect width='780' height='470' fill='#ffffff'/>
<text x='24' y='28' font-size='15' font-weight='600' fill='#1f2328'>ばらばらにつないだリストでは、Fascon の Id の連鎖が生ポインタより速い</text>
<text x='24' y='50' font-size='11.5' fill='#59636e'>1 タスクあたりの時間（ns、短いほど速い）· 6 万タスクの vruntime の合計 · Fascon 1.0.0</text>
<text x='24' y='68' font-size='11.5' fill='#1f2328'>ばらばら: Fascon が 1.2〜2.8 倍速い。作成順: 生ポインタが 1.3〜1.9 倍速い。表の走査: 1 ns 未満。</text>
<rect x='24' y='79' width='12' height='10' rx='2' fill='#2f6fdb'/><text x='42' y='88' font-size='11.5' fill='#59636e'>Fascon</text>
<rect x='104' y='79' width='12' height='10' rx='2' fill='#9aa1aa'/><text x='122' y='88' font-size='11.5' fill='#59636e'>生ポインタの C</text>
<rect x='262' y='79' width='12' height='10' rx='2' fill='#9aa1aa'/><text x='280' y='88' font-size='11.5' fill='#59636e'>濃い色 = gcc 13.3</text>
<rect x='406' y='79' width='12' height='10' rx='2' fill='#9aa1aa' fill-opacity='0.45'/><text x='424' y='88' font-size='11.5' fill='#59636e'>薄い色 = clang 18.1</text>
<text x='24' y='118' font-weight='600' fill='#1f2328'>作成順につないだ場合</text>
<text x='36' y='142' fill='#1f2328'>C・生ポインタ（連続した malloc）</text>
<rect x='320' y='126' width='13.8' height='10' rx='2' fill='#9aa1aa' fill-opacity='1'/>
<text x='339.8' y='135' font-size='11' fill='#59636e'>2.86 ns</text>
<rect x='320' y='139' width='13.8' height='10' rx='2' fill='#9aa1aa' fill-opacity='0.45'/>
<text x='339.8' y='148' font-size='11' fill='#59636e'>2.86 ns</text>
<text x='36' y='180' fill='#1f2328'>Fascon・get での Id の連鎖（分岐）</text>
<rect x='320' y='164' width='18.5' height='10' rx='2' fill='#2f6fdb' fill-opacity='1'/>
<text x='344.5' y='173' font-size='11' fill='#59636e'>3.82 ns</text>
<rect x='320' y='177' width='25.9' height='10' rx='2' fill='#2f6fdb' fill-opacity='0.45'/>
<text x='351.9' y='186' font-size='11' fill='#59636e'>5.35 ns</text>
<text x='36' y='218' fill='#1f2328'>Fascon・@task[id] での Id の連鎖（ラッチ）</text>
<rect x='320' y='202' width='17.9' height='10' rx='2' fill='#2f6fdb' fill-opacity='1'/>
<text x='343.9' y='211' font-size='11' fill='#59636e'>3.70 ns</text>
<rect x='320' y='215' width='26.4' height='10' rx='2' fill='#2f6fdb' fill-opacity='0.45'/>
<text x='352.4' y='224' font-size='11' fill='#59636e'>5.45 ns</text>
<text x='24' y='254' font-weight='600' fill='#1f2328'>ばらばらの順につないだ場合</text>
<text x='36' y='278' fill='#1f2328'>C・生ポインタ（連続した malloc）</text>
<rect x='320' y='262' width='268.9' height='10' rx='2' fill='#9aa1aa' fill-opacity='1'/>
<text x='594.9' y='271' font-size='11' fill='#59636e'>55.61 ns</text>
